<script>
class Racket {
    constructor(mass, balance, swingweight, twistweight, length=68.58) {
        this.mass = mass; this.balance = balance; this.swingweight = swingweight; this.twistweight = twistweight; this.length = length;
    }
}
function customizeRacketFromWeights(b,w){let m=b.mass;let wY=m*b.balance;let sw=b.swingweight;let tw=b.twistweight;for(const x of w){m+=x.mass;wY+=x.mass*x.y;if(x.y>=10)sw+=(x.mass/1000)*(x.y-10)**2;tw+=(x.mass/1000)*x.x*x.x}
return new Racket(m,wY/m,sw,tw,b.length)}
function getParamValue(r,p){switch(p){case'sw':return r.swingweight;case'tw':return r.twistweight;case'mass':return r.mass;case'balance':return r.balance;case'rw':return r.recoilweight;case'mgri':return r.mgr_i;case'ico':return r.polarization_index;default:return 0}}
function computeMultiGoalScoreSort(sol,base,goals){const n=goals.length;if(n===0)return 0;let sc=0;for(let i=0;i<n;i++){const g=goals[i];const av=i===0?sol.achieved:((sol._multiGoals&&sol._multiGoals[g.param]!==undefined)?sol._multiGoals[g.param]:getParamValue(customizeRacketFromWeights(base,sol.weights),g.param));sc+=Math.max(1-0.05*i,0)*Math.abs(av-g.target)/Math.max(Math.abs(g.target),1)}return sc}

console.log(typeof computeMultiGoalScoreSort);
</script>
